<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College SecureVote</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 12px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    input, button, select { padding: 8px; margin: 6px 0; width: 100%; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
    .mono { font-family: monospace; word-break: break-all; }
  </style>
</head>
<body>
  <h1>College SecureVote (Testnet)</h1>
  <p>This MVP verifies student identity via OTP, issues an anonymous voting credential, and submits votes to a blockchain smart contract.</p>

  <section>
    <h2>1) Register</h2>
    <input id="studentId" placeholder="Student ID" />
    <input id="name" placeholder="Full name" />
    <input id="email" placeholder="College email" />
    <button id="registerBtn">Register + Generate OTP</button>
    <p id="otpOut"></p>
  </section>

  <section>
    <h2>2) Verify OTP</h2>
    <input id="otp" placeholder="Enter OTP" />
    <button id="verifyBtn">Verify</button>
    <p id="verifyOut"></p>
  </section>

  <section>
    <h2>3) Issue Anonymous Credential</h2>
    <button id="credentialBtn">Issue Credential</button>
    <p>Nullifier Hash: <span id="nullifier" class="mono"></span></p>
  </section>

  <section>
    <h2>4) Cast Vote (MetaMask)</h2>
    <input id="contractAddress" placeholder="Contract Address" />
    <select id="candidateId">
      <option value="0">Candidate 0</option>
      <option value="1">Candidate 1</option>
      <option value="2">Candidate 2</option>
    </select>
    <button id="voteBtn">Cast Vote</button>
    <p id="voteOut"></p>
  </section>

  <section>
    <h2>5) Read Results</h2>
    <button id="resultsBtn">Refresh Results</button>
    <pre id="resultsOut"></pre>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
